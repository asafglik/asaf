<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>יש להתחבר מחדש – חלון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{background:#323233;display:grid;place-items:center;padding:16px;min-height:100vh}
  .overlay{position:fixed;inset:0;background:var(--overlay)}
  .modal{position:relative;width:min(100%,500px);background:var(--surface);border-radius:14px;
    padding:28px 32px 28px 28px;display:flex;align-items:center;gap:24px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
  .modal__body{flex:1;min-width:0}
  .modal h1{font-size:22px;margin-bottom:8px}
  .modal p{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:20px;max-width:32ch}
  .modal .btn{height:40px;min-width:148px;padding:0 24px;font-size:14px}
  .modal .illus{width:140px;height:140px;flex:none}
  .close{position:absolute;top:10px;left:10px;width:32px;height:32px;border:0;background:none;border-radius:8px;
    color:#5B6078;cursor:pointer;display:grid;place-items:center;transition:background .15s}
  .close:hover{background:rgba(27,33,64,.07)}
  .close:focus-visible{outline:2px solid var(--accent)}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
  @media (max-width:520px){
    .modal{flex-direction:column;text-align:center;padding:40px 24px 28px}
    .modal p{margin-inline:auto}
    .modal .illus{order:-1;width:120px;height:120px}
  }
</style>
</head>
<body>
  <div class="overlay" aria-hidden="true"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
    <button class="close" type="button" aria-label="סגירה">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l12 12M14 2L2 14"/></svg>
    </button>
    <div class="modal__body">
      <h1 id="t">יש להתחבר מחדש למערכת</h1>
      <p id="d">כדי לשמור על אבטחת החשבון שלך, ניתקנו אותך מהמערכת לאחר חוסר פעילות ממושך</p>
      <a class="btn" href="#">התחבר מחדש</a>
    </div>
    <img class="illus" src="assets/keys.svg" alt="" width="130" height="130">
  </div>
</body>
</html>
