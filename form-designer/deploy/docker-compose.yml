# Central cloud server: designer + render API for all customers, behind HTTPS (Caddy).
#   cp deploy/.env.example deploy/.env    (fill in DOMAIN and FD_API_KEY)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  form-designer:
    build:
      context: ..
      args:
        WITH_LIBREOFFICE: ${WITH_LIBREOFFICE:-0}
    image: form-designer
    restart: unless-stopped
    environment:
      FD_MODE: full
      FD_API_KEY: ${FD_API_KEY:?set FD_API_KEY in deploy/.env}
      FD_MAX_CONCURRENT: ${FD_MAX_CONCURRENT:-4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - fd-storage:/app/storage
    shm_size: 1gb
    expose:
      - "3700"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - form-designer

volumes:
  fd-storage:
  caddy-data:
